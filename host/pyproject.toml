[project]
name = "amh-host"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bleak==3.0.2",
    "ollama>=0.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["amh*"]
